name: Compilador APK con Buildozer

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Descomprimir proyecto
        run: |
          unzip app_medica_ia.zip -d .

      - name: Instalar dependencias de Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer Cython==0.29.33

      - name: Compilar APK con Buildozer
        run: |
          buildozer -v android debug

      - name: Subir APK generada
        uses: actions/upload-artifact@v4
        with:
          name: app-release-debug
          path: bin/*.apk
