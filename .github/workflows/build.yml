name: Compilador APK con Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      # Forzar la aceptación automática de todas las licencias de Android en el entorno de la nube
      ACCEPT_LICENSE: "yes"

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias de Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libtool-bin
          pip install --upgrade pip
          pip install --user --upgrade Cython==0.29.36 buildozer

      - name: Pre-crear carpetas de licencias de Android
        run: |
          mkdir -p ~/.android
          echo "### License accepted" > ~/.android/repositories.cfg
          # Crear el archivo de licencias oficiales con sus hashes en la carpeta de usuario
          mkdir -p $HOME/.android/licenses
          echo -e "\n8933bac160af4272fa11e854992d4f559bc1c305" > $HOME/.android/licenses/android-sdk-license
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fb5" >> $HOME/.android/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a648b0" >> $HOME/.android/licenses/android-sdk-license

      - name: Compilador APK con Buildozer
        run: |
          yes | buildozer -v android debug || buildozer -v android debug

      - name: Subir APK generada
        uses: actions/upload-artifact@v4
        with:
          name: app-release-debug
          path: bin/*.apk
