name: Compilador APK con Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILDER_ACCEPT_LICENSES: "1"

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias de Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libtool-bin
          pip install --upgrade pip
          pip install --user --upgrade Cython==0.29.36 buildozer

      - name: Compilador APK con Buildozer
        run: |
          buildozer -v android debug

      - name: Subir APK generada
        uses: actions/upload-artifact@v4
        with:
          name: app-release-debug
          path: bin/*.apk
