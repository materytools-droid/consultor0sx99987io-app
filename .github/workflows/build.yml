name: Compilador APK con Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema y arquitectura de 32 bits
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libtool-bin \
            libc6:i386 libstdc++6:i386 zlib1g:i386 libbz2-1.0:i386

      - name: Actualizar pip y herramientas de Python
        run: |
          pip install --upgrade pip
          pip install --user --upgrade Cython==0.29.36 buildozer

      - name: Inyectar licencias de Android limpias
        run: |
          # Eliminar conflictos previos si existen como archivo
          rm -rf ~/.android/licenses
          rm -rf $HOME/.buildozer/android/platform/android-sdk/licenses
          
          # Crear directorios limpios
          mkdir -p ~/.android
          mkdir -p ~/.android/licenses
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          
          echo "### License accepted" > ~/.android/repositories.cfg
          
          # Hashes oficiales de licencias
          LICENSE_CONTENT="d56f5187479451eabf01fb78af6dfcb131a648b0\n8933bac160af4272fa11e854992d4f559bc1c305\n24333f8a63b6825ea9c5514f83c2829b004d1fb5"
          
          echo -e "$LICENSE_CONTENT" > ~/.android/licenses/android-sdk-license
          echo -e "$LICENSE_CONTENT" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Compilador APK con Buildozer
        run: |
          buildozer -v android debug

      - name: Subir APK generada
        uses: actions/upload-artifact@v4
        with:
          name: app-release-debug
          path: bin/*.apk
