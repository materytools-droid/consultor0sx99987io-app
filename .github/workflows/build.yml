name: Compilador APK con Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias de Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libtool-bin
          pip install --upgrade pip
          pip install --user --upgrade Cython==0.29.36 buildozer

      - name: Pre-crear estructura y licencias de Android para Buildozer
        run: |
          mkdir -p ~/.android
          echo "### License accepted" > ~/.android/repositories.cfg
          # Crear la ruta donde buildozer instala el SDK internamente
          mkdir -p .buildozer/android/platform/android-sdk/licenses
          echo -e "\n8933bac160af4272fa11e854992d4f559bc1c305" > .buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fb5" >> .buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a648b0" >> .buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Compilador APK con Buildozer
        run: |
          buildozer -v android debug

      - name: Subir APK generada
        uses: actions/upload-artifact@v4
        with:
          name: app-release-debug
          path: bin/*.apk
